version: 2

models:
  - name: fct_daily_weather
    description: One row per town and day, ready for a dashboard.
    columns:
      - name: location_code
        data_tests: [not_null]
      - name: observed_date
        data_tests: [not_null]
      - name: hours_observed
        data_tests: [not_null]
      - name: rain_total_mm
        data_tests: [not_null]
