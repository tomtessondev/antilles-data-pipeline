name: dbt docs

on:
  push:
    branches: [main]
    paths:
      - "transform/**"
      - "scripts/load_fixture.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTILLES_DB_PATH: ${{ github.workspace }}/data/antilles.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[transform]"
      - name: Load fixture data (no network needed)
        run: python scripts/load_fixture.py "$ANTILLES_DB_PATH"
      # The catalog reads column types and stats from the built tables, so build first.
      - name: dbt build
        working-directory: transform
        run: dbt build --profiles-dir .
      - name: dbt docs generate
        working-directory: transform
        run: dbt docs generate --profiles-dir . --static
      - name: Assemble site
        run: |
          mkdir -p site
          cp transform/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
