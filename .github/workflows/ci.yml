name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # orchestration pulls in Dagster and dbt: the tests run the whole Dagster job.
      - run: pip install -e ".[dev,orchestration]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive
      # No AWS access in CI: validate the syntax and references, without a backend.
      - run: terraform init -backend=false -input=false && terraform validate
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/bootstrap

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI image (default target)
        run: docker build -t antilles-pipeline .
      - name: Build the Dagster image used by docker compose
        run: docker build --target dagster -t antilles-pipeline-dagster .
      - name: Check that the Dagster definitions load inside the image
        run: >
          docker run --rm antilles-pipeline-dagster
          dagster definitions validate -m antilles_pipeline.orchestration.definitions

  dbt:
    runs-on: ubuntu-latest
    env:
      ANTILLES_DB_PATH: ${{ github.workspace }}/data/antilles.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[transform]"
      - name: Load fixture data (no network needed)
        run: python scripts/load_fixture.py "$ANTILLES_DB_PATH"
      - name: dbt build (models + tests)
        working-directory: transform
        run: dbt build --profiles-dir .
      - name: Reload fixture and rebuild (exercises the incremental path)
        run: |
          python scripts/load_fixture.py "$ANTILLES_DB_PATH"
          cd transform && dbt build --profiles-dir .
      - name: Source freshness
        working-directory: transform
        run: dbt source freshness --profiles-dir .
      - name: Docs generate (published from main by docs.yml)
        working-directory: transform
        run: dbt docs generate --profiles-dir . --static
      - name: Export marts for the dashboard contract test
        run: antilles-pipeline export --out "$RUNNER_TEMP/marts.json"
      - uses: actions/upload-artifact@v4
        with:
          name: marts-fixture-export
          path: ${{ runner.temp }}/marts.json
          retention-days: 3

  dashboard:
    needs: dbt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/download-artifact@v4
        with:
          name: marts-fixture-export
          path: ${{ runner.temp }}/export
      - name: Unit tests and contract test against a fresh export
        run: npm test
        env:
          MARTS_FILE: ${{ runner.temp }}/export/marts.json
      - run: npm run build
