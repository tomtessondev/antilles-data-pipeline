name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    env:
      ANTILLES_DB_PATH: ${{ github.workspace }}/data/antilles.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[transform]"
      - name: Load fixture data (no network needed)
        run: python scripts/load_fixture.py "$ANTILLES_DB_PATH"
      - name: dbt build (models + tests)
        working-directory: transform
        run: dbt build --profiles-dir .
      - name: Reload fixture and rebuild (exercises the incremental path)
        run: |
          python scripts/load_fixture.py "$ANTILLES_DB_PATH"
          cd transform && dbt build --profiles-dir .
      - name: Source freshness
        working-directory: transform
        run: dbt source freshness --profiles-dir .
      - name: Docs generate (published from main by docs.yml)
        working-directory: transform
        run: dbt docs generate --profiles-dir . --static
