name: Daily pipeline

on:
  schedule:
    - cron: "0 10 * * *" # 06:00 in the Antilles
  workflow_dispatch:

permissions:
  contents: write # push the marts export to the data branch
  id-token: write # OIDC token exchanged for short-lived AWS credentials

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTILLES_DB_PATH: ${{ github.workspace }}/data/antilles.duckdb
      ANTILLES_EXPORT_PATH: ${{ github.workspace }}/data/marts.json
      # The S3 lake created by infra/ (terraform output lake_url). Without the variable, a
      # throwaway directory on the runner, so a run only sees its own extraction.
      ANTILLES_LAKE_URL: ${{ vars.LAKE_S3_URL || format('{0}/data/lake', github.workspace) }}
    steps:
      - uses: actions/checkout@v4
      # infra/ variable ci_auth picks one of the two steps below (repository variable AWS_AUTH).
      - name: AWS credentials for the lake (OIDC role, no stored keys)
        if: vars.AWS_AUTH == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Free-plan accounts deny OIDC providers: a dedicated IAM user limited to the lake.
      - name: AWS credentials for the lake (IAM user, bucket-only permissions)
        if: vars.AWS_AUTH == 'iam_user'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[orchestration]"
      - name: Parse the dbt project (the Dagster dbt assets are built from the manifest)
        working-directory: transform
        run: dbt parse --profiles-dir .
      # The same Dagster job that the Docker Compose stack schedules: extract 31 days into
      # the lake, rebuild the raw tables from the whole lake, dbt build, JSON export.
      - name: Run the daily Dagster job
        run: dagster job execute -m antilles_pipeline.orchestration.definitions -j daily_pipeline
      - name: Source freshness
        working-directory: transform
        run: dbt source freshness --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: antilles-duckdb
          path: |
            data/antilles.duckdb
            data/marts.json
          retention-days: 14
      # The dashboard reads marts.json from the data branch. It holds a single commit,
      # replaced on every run, so the repository does not grow by one export a day.
      - name: Publish marts to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp data/marts.json "$RUNNER_TEMP/publish/"
          cd "$RUNNER_TEMP/publish"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marts.json
          git commit -q -m "Marts export from run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
